name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]   # 每天 UTC 0 点更新
  workflow_dispatch:                   # 支持手动触发
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""                       # 不要默认的头部/活动等区块，只出日历
          config_timezone: Asia/Shanghai # streak 按自然日算，时区要设对
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year   # 或 full-year
